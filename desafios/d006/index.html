<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Desafio das tags</h1>
    <p>Em HTML5, podemos inserir os elemetos da lista a seguir. <br> Passse o mouse sobre os termos para descobrir qual tag deverá ultilizar em cada caso.</p>

    <ul type="square">
        <li><abbr title="use a tag &lt;p&gt;">Paragrafós</abbr></li>
        <li><abbr title="use a tag &lt;h1&gt; para títulos e  Subtitulos:&lt;h2&gt;&lt;h3&gt;,&lt;h4&gt;....">Títulos</abbr></li>
        <li><abbr title="use a tag &lt;img&gt;">Imagens</abbr></li>
        <li><abbr title="use a tag &lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="use a tag &lt;code&gt; para fonte monoespaçada e &lt;pre&gt;&lt;code&gt; para pré-formatado com quebras">Códigos-fonte</abbr></li>
        <li><abbr title="use a tag &lt;ol&gt; para listas numeradas">Lista numeradas</abbr></li>
        <li><abbr title="use a tag &lt;ul&gt; para listas dermacadas">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
