<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media ALuno</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 600px;
            border-collapse: collapse;
        }

        tr.agrupando{
            background-color: lightslategrey;
            text-align: center;
            border: 1px solid black;
            padding: 10px;
            color: white;

        }

        td, th{
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr class="agrupando">
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplina</th>
                <th colspan="2" scope="colgroup">Nota</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr class="agrupando">
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="5" scope="rowgroup">Exatas</th>
            </tr>
            <tr>
                <td>Matemática</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.00</td>
                <td>0.00</td>    
                <td>0.00</td>
                
            </tr>
            <tr>
                <td>Química</td>
                <td>0.00</td>
                <td>0.00</td>    
                <td>0.00</td>
                
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.00</td>
                <td>0.00</td>    
                <td>0.00</td>
            </tr>

            <tr class="agrupando">
                <th  colspan="4" scope="row">Medías das Exatas</th>
                <td>0.00</td>
            </tr>

            <tr>
                <th rowspan="3" scope="rowgroup">Humanas</th>
            </tr>

            <tr>
                <td>Historia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
                
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr class="agrupando">
                <th colspan="4" scope="row">Medía de Humanas</th>
                <td>0.00</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
