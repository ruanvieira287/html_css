<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: red;
            text-decoration: none;
            font: bold;
        }
        a:visited{
            color: rgb(82, 4, 4);
        }
        a:hover{
            text-decoration: underline;
            color: black;
        }
        a:active{
            color: yellow;
        }
        a::after{
            content: '[Links]';
            text-decoration: none;
            font-weight: normal;
            color: darkgreen;
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>

    <ul>
        <li><a href="https://github.com/ruanvieira12" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@ruanlascuran6654" target="_blank" class="especial">Canal Do Youtube</a></li>
        <li><a href="https://www.instagram.com/ru4n_v1e1r4/" target="_blank">Instagram</a></li>
    </ul>
</body>
</html>
