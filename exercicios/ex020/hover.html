<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div > p{
            display: none; /*A propriedade display: none; serve para esconder completamente um elemento da página. Além de esconder, ela faz com que o elemento deixe de ocupar espaço no layout.*/
        }
        div:hover > p{
            display: block;
            color: aliceblue;
            background-color: red;
            width: 300px;
        }
        div:hover{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hove</h1>
        <p>Passe o mouse sobre o texto abaixo</p>
    <div>
            Passe o mouse aqui
        <p>Texto escondido</p>
    </div>
</body>
</html>
