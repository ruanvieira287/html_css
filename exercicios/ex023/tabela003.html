<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 300px;
            border-collapse: collapse;
        }

        td{
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
        <h1>MESCLAGEM DE CÉLULAS</h1>
    
    <table>
        <tbody>
            <tr>
                <td>A</td>
                <td colspan="2">B</td>
                
                
            </tr>
            <tr>
                <td>D</td>
                <td>E</td>
                <td rowspan="3">F</td>
                
            </tr>
            <tr>
                <td rowspan="2">G</td>
                <td>H</td>
                
            </tr>
            <tr>
                <td>K</td>
            
                
            </tr>
        </tbody>
    </table>
    
</body>
</html>
