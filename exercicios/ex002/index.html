<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Você pode escrever
        um parágrafo de 
        qualquer jeito
        Basta colocar 
        tudo no meio do 
        par de tags
        p e /p
    </p>
    <p>
        Se precisar quebrar 
        o texto em algum lugar
        especifico <br> como esse, 
        Você pode usar a tag &lt;br&gt;.

    <p>Adicionado alguns simbolos
        &reg;
        &euro;
        &pound;
        &cent;
        &yen;
        &Delta;
    </p>
    <p>Vamos adicionar alguns emoji
        &#x1F596; 
        &#x1F913;
    </p>
    </p>
</body>
</html>
